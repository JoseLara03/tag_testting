# Debug overlay — build with:
#   west build -b nRF52833_tag -- -DEXTRA_CONF_FILE=debug.conf
#
# Purpose: make the firmware survivable under a debugger. Do NOT ship this.

# The blocker for GDB. tag_wdt_start_boot_guard() registers a task_wdt channel
# with a NULL callback, and Zephyr's task_wdt_trigger() answers an expired
# channel with sys_reboot(SYS_REBOOT_COLD). Halting at a breakpoint for longer
# than the 10 s channel therefore reboots the tag as soon as it resumes, so the
# debugger only ever prints "external reset detected" and no breakpoint is
# reached. (The ~120 ms hardware fallback does pause while halted, via
# WDT_OPT_PAUSE_HALTED_BY_DBG — it is this software channel that does not.)
# src/wdt.c compiles the whole boot guard out when this is n.
CONFIG_TASK_WDT=n
CONFIG_WATCHDOG=n

# WARNING: with dwt_isr() dispatched from the GPIO ISR, CONFIG_ASSERT=y makes
# EVERY DW3000 interrupt panic the kernel -- k_mutex_lock() and spi_transceive()
# both carry an unconditional __ASSERT(!arch_is_in_isr(), ...) above their
# non-blocking fast paths. So this build cannot range. It is still the right
# build for catching a *different* illegal-API bug, or for GDB work where the
# radio does not need to run. For anything involving ranging or calibration,
# build without this overlay. See the long note in prj.conf.
CONFIG_ASSERT=y
CONFIG_INIT_STACKS=y

# Callee-saved registers in the exception frame. Costs a little RAM per fault
# but makes a post-mortem backtrace far more likely to unwind correctly.
CONFIG_EXTRA_EXCEPTION_INFO=y
