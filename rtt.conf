# RTT diagnostic overlay -- build with:
#   west build -b nRF52833_tag --pristine -d build_rtt -- -DEXTRA_CONF_FILE=rtt.conf
#   west flash -d build_rtt
#   RTT viewer / JLinkRTTViewer / `west attach -d build_rtt` while J-Link stays connected
#
# Purpose: this board has no serial (CONFIG_SERIAL=n) and CONFIG_LOG=n in
# production, so there is normally no way to see LOG_INF output at all. This
# overlay turns logging on and routes it over Segger RTT instead of UART,
# for the TEMPORARY per-iteration timing prints in uwb_net_runner.c (see
# their own "TEMPORARY" comments -- remove both the prints and this file
# together once the stall is found).
#
# Deferred logging, NOT immediate: CLAUDE.md (ANCLA) already paid for the
# CONFIG_LOG_MODE_IMMEDIATE mistake once (synchronous console writes from a
# time-critical loop blew the beacon timing budget and crashed the board).
# Same risk here -- this loop is exactly as timing-sensitive.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=4096
