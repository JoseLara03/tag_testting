# RTT console overlay — build with:
#   west build -b nRF52833_tag --pristine -d build_rtt -- "-DEXTRA_CONF_FILE=rtt.conf"
#
# Purpose: see the tag's boot. The board defconfig turns the console off
# entirely (CONFIG_SERIAL/CONSOLE/UART_CONSOLE/LOG all =n) and the DTS has no
# zephyr,console chosen node, so UART is not available without pin work. RTT
# rides the SWD link the J-Link runner already uses, so it needs no extra
# wiring. Read it with JLinkRTTViewer.
#
# This is deliberately NOT debug.conf. That overlay sets CONFIG_ASSERT=y, which
# — by its own warning — makes every DW3000 interrupt panic the kernel, because
# dwt_isr() runs from the GPIO ISR and k_mutex_lock()/spi_transceive() both
# assert !arch_is_in_isr(). A build with debug.conf cannot range, so it cannot
# be used to diagnose a radio that is failing to receive.

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
# Immediate mode: a bring-up failure ends in k_sleep(K_FOREVER), and a deferred
# backend's flush thread may never run to drain the message that explains why.
CONFIG_LOG_MODE_IMMEDIATE=y

# The boot guard registers a task_wdt channel with a NULL callback, so an
# expired channel reboots cold. On the uwb_init() failure path main() never
# reaches tag_wdt_run_feeder(), so the channel always expires: the tag reboots
# roughly every 10 s and the failure scrolls past instead of standing still.
CONFIG_TASK_WDT=n
CONFIG_WATCHDOG=n

# NOTE: power management was tested here as the cause of TXFRS never arriving
# and RULED OUT -- CONFIG_PM/PM_DEVICE/PM_DEVICE_RUNTIME=n changed nothing, the
# transmit still failed on every attempt. Left out deliberately so this overlay
# does not perturb power behaviour. The "pm_device: Unbalanced suspend" warnings
# are real but unrelated to the transmit fault; they were merely invisible until
# this overlay turned logging on.
