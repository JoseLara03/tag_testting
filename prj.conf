CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF52_Tag"
CONFIG_BT_NUS=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# nPM1304 PMIC: needed so the BUCK/LDO rails are applied at boot.
CONFIG_REGULATOR=y
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_NDEF_URI_MSG=y
CONFIG_NFC_NDEF_PARSER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_GPIO=y
CONFIG_FPU=y
# Soft-float calling convention: the FPU still runs the LLS math, but float args
# pass in core registers so the image links against the soft-float precompiled
# DW3000 driver (libdwt_uwb_driver-m4-sfp). FP_HARDABI breaks that link.
CONFIG_FP_SOFTABI=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_PM=y
