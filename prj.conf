CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="nRF52_Tag"
CONFIG_BT_NUS=y
CONFIG_I2C=y
CONFIG_SENSOR=y
# nPM1304 PMIC: needed so the BUCK/LDO rails are applied at boot.
CONFIG_REGULATOR=y
# nPM1304 LED0 in hardware "charging" mode; the driver only writes the mode
# register at init, nothing calls into it at runtime.
CONFIG_LED=y
CONFIG_NFC_T4T_NRFXLIB=y
CONFIG_NFC_NDEF=y
CONFIG_NFC_NDEF_MSG=y
CONFIG_NFC_NDEF_RECORD=y
CONFIG_NFC_NDEF_URI_REC=y
CONFIG_NFC_NDEF_URI_MSG=y
CONFIG_NFC_NDEF_PARSER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_GPIO=y
CONFIG_FPU=y
# Soft-float calling convention: the FPU still runs the LLS math, but float args
# pass in core registers so the image links against the soft-float precompiled
# DW3000 driver (libdwt_uwb_driver-m4-sfp). FP_HARDABI breaks that link.
CONFIG_FP_SOFTABI=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_MATRIX=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# Fill thread stacks with a pattern at creation so k_thread_stack_space_get()
# can report a high-water mark (the `stack` NUS command). Diagnostic aid for the
# deep calibration path; costs a little boot time. Drop it once the calibration
# stack question is settled.
CONFIG_INIT_STACKS=y
# CONFIG_ASSERT is deliberately NOT enabled here; it lives in debug.conf.
#
# It did its job -- it is how the calibration crash was pinned down -- but it
# cannot stay on in this firmware as it stands. dwt_isr() runs in the GPIO ISR
# and reaches the DW3000 through readfromspi()/writetospi(), which call
# k_mutex_lock() and spi_transceive(). Both carry an UNCONDITIONAL
# __ASSERT(!arch_is_in_isr(), ...) that sits above their non-blocking fast
# paths, so with asserts on, every single DW3000 interrupt panics the kernel.
# Moving dwt_isr() out of the ISR to satisfy them was tried and reverted: it
# cut accepted ranges to 1 in 100 (see deca_irq_handler in platform/port.c).
#
# What makes the ISR path safe in practice is that spi_mutex is never
# contended: wait_event() drains the device with the IRQ masked and only arms
# it while parked in k_sem_take(), where the thread holds no SPI state. The
# uncontended k_mutex_lock() fast path never pends. That is a real invariant,
# not luck -- but it is an invariant the assert cannot see.
#
# The proper fix is an ISR-safe SPI path (polled transfer when k_is_in_isr()),
# after which this can be turned back on permanently.
CONFIG_PM=y
